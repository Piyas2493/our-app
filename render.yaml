# Render Blueprint -- deploys jeeva as a persistent Python web service
# (unlike Vercel, Render runs long-lived processes, which jeeva actually
# needs: uvicorn stays up between requests rather than cold-starting per
# invocation).
#
# ocr-service (handwriting OCR) is deliberately NOT deployed here. It's a
# redundant second-opinion signal on top of Gemini's own multimodal OCR
# (which already handles printed and handwritten documents as the primary
# extraction path), from a model explicitly not fine-tuned on real clinical
# handwriting -- and it OOM'd even on the smallest model at Render's free
# 512MB limit. Paying for the Standard plan for an unverified accuracy
# signal wasn't worth it this close to the deadline; the app already
# degrades cleanly without it (extractHandwritingText() returns null and
# Gemini's own extraction proceeds unaffected). The code still lives at
# ocr-service/ and runs fine locally if this decision changes later.
#
# The Next.js app itself is NOT here -- it goes to Vercel, which is
# built for exactly that (unified frontend + API routes, zero config).
#
# To use: Render dashboard -> New -> Blueprint -> point at this repo.
# Secrets marked `sync: false` must be filled in manually in Render's
# dashboard after the blueprint creates the services -- never commit
# real values for these.
services:
  - type: web
    name: jeevanlink-jeeva
    runtime: python
    rootDir: jeeva
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BHASHINI_ULCA_API_KEY
        sync: false
      - key: JEEVA_FRONTEND_ORIGIN
        sync: false # set to the real Vercel deployment URL, e.g. https://jeevanlink.vercel.app
      - key: JEEVANLINK_DEMO
        value: "1"
